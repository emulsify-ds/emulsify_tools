name: Semantic Release on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Attempt Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Drupal.org sync configuration
        id: drupal_sync
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          DRUPAL_ORG_SSH_KEY: ${{ secrets.DRUPAL_ORG_SSH_KEY }}
          DRUPAL_REPO_URL: ${{ secrets.DRUPAL_REPO_URL }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          if [[ -z "$DRUPAL_ORG_SSH_KEY" || -z "$DRUPAL_REPO_URL" || -z "$KNOWN_HOSTS" ]]; then
            echo "::warning title=Drupal.org sync skipped::Configure DRUPAL_ORG_SSH_KEY, DRUPAL_REPO_URL, and KNOWN_HOSTS to enable automatic release mirroring."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add remote SSH Key
        if: steps.drupal_sync.outputs.enabled == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DRUPAL_ORG_SSH_KEY }}
          config: ${{ secrets.SSH_CONFIG }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Sync release tags to Drupal.org Project
        if: steps.drupal_sync.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          git remote add drupal-org '${{ secrets.DRUPAL_REPO_URL }}'
          git push drupal-org "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git push drupal-org HEAD:main
